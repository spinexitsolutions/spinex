# Downloads the stock photos the website uses into public/images/stock and commits them,
# so the images live in the repository and nobody has to run a command on their computer.
# Runs by itself when this file changes; can also be started from GitHub → Actions → "Download stock images" → Run workflow.
name: Download stock images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/download-stock-images.yml"
      - "scripts/offline-images.mjs"

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download photos
        run: node scripts/offline-images.mjs
      - name: Commit photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add public/images/stock
          if git diff --cached --quiet; then
            echo "No new photos."
          else
            git commit -m "Add stock photos to the repository"
            git push
          fi
